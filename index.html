<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FIO Investimentos</title>
    <style>
        :root {
            --bg-black: #000000;
            --uber-gray: #1f1f1f;
            --text-white: #ffffff;
            --text-muted: #afafaf;
            --fio-purple: #4f46e5;
        }
        
        body { 
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            background-color: var(--bg-black); 
            color: var(--text-white); 
            margin: 0; 
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        /* Ilustracao do Fio passando por tras e cortando o meio do site */
        .fio-background {
            position: absolute;
            top: 0;
            left: -10%;
            width: 120%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }
        .fio-linha {
            width: 100%;
            height: 100%;
            stroke: var(--fio-purple);
            stroke-width: 3;
            fill: none;
            opacity: 0.6;
            filter: drop-shadow(0px 0px 15px rgba(99, 102, 241, 0.5));
        }

        .container { 
            max-width: 480px; 
            width: 100%; 
            padding: 20px; 
            box-sizing: border-box;
            position: relative;
            z-index: 2;
        }

        .brand-box {
            text-align: center;
            margin-bottom: 50px;
        }

        /* Logo FIO Grande e Imponente */
        h1 { 
            margin: 0; 
            font-size: 5rem; 
            letter-spacing: 8px; 
            font-weight: 900;
            color: var(--text-white);
            text-transform: uppercase;
        }

        .tagline {
            color: var(--text-muted);
            font-size: 1.1rem;
            margin-top: 15px;
            line-height: 1.6;
            font-weight: 300;
        }

        .action-box {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        /* Botoes Estilo Uber */
        .btn-uber { 
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--bg-black); 
            background-color: var(--text-white);
            text-decoration: none; 
            padding: 18px; 
            border-radius: 8px; 
            font-weight: 600; 
            font-size: 1.1rem; 
            text-align: center; 
            transition: background-color 0.2s, transform 0.1s;
            cursor: pointer;
            border: none;
            width: 100%;
        }

        .btn-uber:hover {
            background-color: #eeeeee;
            transform: scale(1.01);
        }

        .btn-secondary {
            background-color: var(--uber-gray);
            color: var(--text-white);
            border: 1px solid #333333;
        }

        .btn-secondary:hover {
            background-color: #2d2d2d;
        }

        .footer-text {
            text-align: center;
            color: #555555;
            font-size: 0.8rem;
            margin-top: 40px;
            letter-spacing: 0.5px;
        }
    </style>
</head>
<body>

    <!-- Vetor do Fio que corta o fundo do site -->
    <div class="fio-background">
        <svg width="100%" height="100%" preserveAspectRatio="none" viewBox="0 0 100 100">
            <path d="M 0,20 C 30,40 40,10 70,70 C 85,95 90,80 100,50" class="fio-linha" />
        </svg>
    </div>

    <div class="container">
        <div class="brand-box">
            <h1>FIO</h1>
            <p class="tagline">Conectando quem quer investir a grandes negócios e pequenas empresas.</p>
        </div>

        <div class="action-box">
            <!-- BOTÃO EMPRESARIAL -->
            <button onclick="abrirPainelEmpresa()" class="btn-uber">
                Quero Capital
            </button>

            <!-- BOTÃO INVESTIDOR -->
            <button onclick="abrirPainelInvestidor()" class="btn-uber btn-secondary">
                Quero Investir
            </button>
        </div>

        <p class="footer-text">© 2026 FIO Investimentos. Conexões operacionais blindadas.</p>
    </div>

    <script>
        const WHATSAPP_NUMERO = "5522992777193";

        function abrirPainelEmpresa() {
            const msgEmpresa = 
                "🏢 [𝓕𝓘𝓞] • MESA CORPORATIVA\n" +
                "----------------------------------------\n" +
                "Olá! Seja bem-vindo à FIO.\n\n" +
                "Analisamos o seu interesse em captar capital para reforma, ajuste ou expansão do seu negócio.\n\n" +
                "Para darmos início à análise de viabilidade e montagem do seu portfólio blindado (onde seu nome é preservado por sigilo), por favor, responda a este formulário inicial em uma única mensagem:\n\n" +
                "1. Nome completo do responsável:\n" +
                "2. CNPJ e Razão Social da Empresa:\n" +
                "3. Setor de atuação (Ex: Alimentício, Automotivo):\n" +
                "4. Quanto de capital (R$) sua empresa precisa hoje?\n" +
                "5. Qual foi o lucro líquido médio dos últimos 6 meses?\n\n" +
                "⚠️ Atenção: Ao enviar, você concorda com o repasse mensal fixo de 15% do seu lucro líquido para a distribuição das cotas de seus apoiadores anônimos.\n" +
                "----------------------------------------";
            
            window.location.href = "https://whatsapp.com" + WHATSAPP_NUMERO + "&text=" + encodeURIComponent(msgEmpresa);
        }

        function abrirPainelInvestidor() {
            const msgInvestidor = 
                "🧵 [𝓕𝓘𝓞] INVESTIMENTOS • PAINEL DO MEMBRO\n" +
                "--------------------------------------------------\n" +
                "Olá! Seja muito bem-vindo à rede blindada de investidores da FIO.\n\n" +
                "Aqui, o seu capital compra cotas padronizadas de R$ 100,00 que aceleram pequenas empresas locais e retornam para você na forma de lucros recorrentes mensais (NÓS). Tudo com anonimato absoluto e segurança jurídica.\n\n" +
                "Para navegar no seu Painel, digite apenas o NÚMERO da opção desejada:\n\n" +
                "1️⃣ VER EMPRESAS (Ativos por Setor) e comprar cotas\n" +
                "2️⃣ CONSULTAR SALDO de rendimentos e Nós acumulados\n" +
                "3️⃣ SOLICITAR SAQUE imediato via Pix\n" +
                "4️⃣ ENVIAR COMPROVANTE de investimento (Pix realizado)\n" +
                "5️⃣ FALAR COM SUPORTE (Falar com um analista humano)\n\n" +
                "--------------------------------------------------\n" +
                "🔒 FIO Operações • Identidades 100% Blindadas";
            
            window.location.href = "https://whatsapp.com" + WHATSAPP_NUMERO + "&text=" + encodeURIComponent(msgInvestidor);
        }
    </script>

</body>
</html>
