<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FIO Investimentos</title>
    <style>
        :root {
            --bg-black: #000000;
            --uber-gray: #1f1f1f;
            --text-white: #ffffff;
            --text-muted: #afafaf;
            --fio-purple: #4f46e5;
            --line-color: rgba(99, 102, 241, 0.25);
        }
        
        body { 
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            background-color: var(--bg-black); 
            color: var(--text-white); 
            margin: 0; 
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        /* Ilustração do Fio passando por trás e cortando o meio do site */
        .fio-background {
            position: absolute;
            top: 0;
            left: -10%;
            width: 120%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }
        .fio-linha {
            width: 100%;
            height: 100%;
            stroke: var(--fio-purple);
            stroke-width: 3;
            fill: none;
            opacity: 0.6;
            filter: drop-shadow(0px 0px 15px rgba(99, 102, 241, 0.5));
        }

        .container { 
            max-width: 480px; 
            width: 100%; 
            padding: 20px; 
            box-sizing: border-box;
            position: relative;
            z-index: 2; /* Fica por cima do fio */
        }

        .brand-box {
            text-align: center;
            margin-bottom: 50px;
        }

        /* Logo FIO Grande e Imponente */
        h1 { 
            margin: 0; 
            font-size: 5rem; 
            letter-spacing: 8px; 
            font-weight: 900;
            color: var(--text-white);
            text-transform: uppercase;
        }

        .tagline {
            color: var(--text-muted);
            font-size: 1.1rem;
            margin-top: 15px;
            line-height: 1.6;
            font-weight: 300;
        }

        .action-box {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        /* Botões Estilo Uber (Bordas retas/suaves, robustos e minimalistas) */
        .btn-uber { 
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--bg-black); 
            background-color: var(--text-white);
            text-decoration: none; 
            padding: 18px; 
            border-radius: 8px; 
            font-weight: 600; 
            font-size: 1.1rem; 
            text-align: center; 
            transition: background-color 0.2s, transform 0.1s;
        }

        .btn-uber:hover {
            background-color: #eeeeee;
            transform: scale(1.01);
        }

        .btn-secondary {
            background-color: var(--uber-gray);
            color: var(--text-white);
            border: 1px solid #333333;
        }

        .btn-secondary:hover {
            background-color: #2d2d2d;
        }

        .footer-text {
            text-align: center;
            color: #555555;
            font-size: 0.8rem;
            margin-top: 40px;
            letter-spacing: 0.5px;
        }
    </style>
</head>
<body>

    <!-- Vetor do Fio que corta o fundo do site -->
    <div class="fio-background">
        <svg width="100%" height="100%" preserveAspectRatio="none" viewBox="0 0 100 100">
            <path d="M 0,20 C 30,40 40,10 70,70 C 85,95 90,80 100,50" class="fio-linha" />
        </svg>
    </div>

    <div class="container">
        <div class="brand-box">
            <h1>FIO</h1>
            <p class="tagline">Conectando quem quer investir a grandes negócios e pequenas empresas.</p>
        </div>

        <div class="action-box">
            <!-- BOTÃO EMPRESARIAL -->
            <!-- Altere o número 5521999999999 para o seu número real de atendimento -->
            <a href="https://5522992777193." 
               target="_blank" class="btn-uber">
                Quero Capital
            </a>

            <!-- BOTÃO INVESTIDOR -->
            <!-- Altere o número 5521999999999 para o seu número real de atendimento -->
            <a href="https://5522992777193." 
               target="_blank" class="btn-uber btn-secondary">
                Quero Investir
            </a>
        </div>

        <p class="footer-text">© 2026 FIO Investimentos. Conexões operacionais blindadas.</p>
    </div>

</body>
</html>
